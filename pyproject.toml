[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-market-universe"
version = "0.1.0"
description = "Point-in-time research harness for falsifiable 90-day equity forecasts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
]

[project.scripts]
market-universe = "ai_market_universe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Lint/type config only. Existing findings are ignored so CI can gate new
# issues without reformatting files owned by other slices.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["artifacts", "data"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "B",
  "UP",
  "I",
  "RUF",
  "SIM",
]
ignore = [
  "E501",
  "I001",
  "UP037",
  "RUF046",
  "RUF059",
  "SIM117",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"src/ai_market_universe/labels.py" = ["F401"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
show_error_codes = true
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "ai_market_universe.schemas"
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = "ai_market_universe.demo"
disable_error_code = ["attr-defined", "index"]
