[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-market-universe"
version = "0.1.0"
description = "Point-in-time research harness for falsifiable 90-day equity forecasts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
]

[project.scripts]
market-universe = "ai_market_universe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
